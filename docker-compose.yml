services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: discord_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-discord_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound strictly to 127.0.0.1 so it is not exposed publicly to the internet.
      # External access is secured via SSH key tunneling (e.g. DBeaver, TablePlus via SSH tunnel).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-discord_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: discord_ai_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-discord_ai}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # Ensure database host points to the postgres container in Docker network
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-discord_ai}}
    ports:
      - "${INSTAGRAM_WEBHOOK_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
